# ==========================================
# FiveM Academy PVP - server.cfg
# ==========================================

echo "Iniciando Academy PVP..."

endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

sv_maxclients 64
sv_hostname "Academy PVP Brasil"
sets locale "pt-BR"
sets tags "academy,pvp,aim,treino"

# KEYMASTER (obrigatório)
sv_licenseKey "change-me"

# OneSync recomendado
set onesync on

# DB (oxmysql)
set mysql_connection_string "mysql://fivem:troque_essa_senha@127.0.0.1:3306/fivem_academy?charset=utf8mb4"

# Recursos padrão
ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager
ensure hardcap
ensure baseevents

# Dependências de DB (instalar manualmente)
# ensure oxmysql

# Academy resources
ensure academy_core
ensure academy_pvp_mode

# Segurança mínima
sv_scriptHookAllowed 0
set sv_enforceGameBuild 2944

# Admin
a add_ace group.admin command allow
# add_principal identifier.license:SEU_IDENTIFIER group.admin
